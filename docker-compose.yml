# Ambiente local do Execution Service: API (5002) + MongoDB (27017) + RabbitMQ (5672, UI 15672).
# Para a saga completa, o OS Service e o Billing Service apontam para o mesmo RabbitMQ.
services:
  execution-api:
    build: .
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Mongo__ConnectionString: mongodb://mongodb:27017
      Mongo__Database: oficina_execucao
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: oficina
      RabbitMq__Password: oficina123
    depends_on:
      mongodb:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: oficina
      RABBITMQ_DEFAULT_PASS: oficina123
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mongo-data:
