# Secret de demonstracao (kind/local). Em producao o CI gera este Secret a partir dos
# GitHub secrets (PROD_JWT_SECRET_KEY, RABBITMQ_PASSWORD, NEW_RELIC_LICENSE_KEY) e nao aplica este arquivo.
apiVersion: v1
kind: Secret
metadata:
  name: oficina-execution-service-secrets
  namespace: oficina-mecanica
type: Opaque
stringData:
  Jwt__SecretKey: "OficinaMecanica@SecretKey#2024!MustBe32CharsMin"
  RabbitMq__Password: "oficina123"
